#	Prod	Dev
#backend	build: ./backend (ton Dockerfile, binaire compilé)	image: golang:1.23-alpine + volume monté + go run
#Port backend	pas exposé (nginx s'en charge)	2000:2000 exposé, pour tester direct sans passer par nginx
#Port frontend	pas exposé (nginx s'en charge)	5173:5173 exposé (port par défaut du serveur dev Vite)
#nginx	présent	absent

services:
  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - docto

  backend:
    image: golang:1.25-alpine
    container_name: backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - go_cache:/go
      - documents:/data/documents # ajout pour pdf assurance decenale
    command: go run ./cmd/server
    ports:
      - "3000:2000"
    environment:
      DATABASE: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      PORT: "2000"
      DOCUMENTS_DIR: /data/documents #ajout pour pdf
    depends_on:
      db:
        condition: service_healthy
    networks:
      - docto

  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"     # <-- ajout, dev seulement
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - docto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5


networks:
  docto:
    driver: bridge

volumes:
  db_data:
  go_cache:
  documents: # ajout pour pdf 
