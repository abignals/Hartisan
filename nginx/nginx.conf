events {}

http {
    client_max_body_size 21m;
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri; #redirection vers https
    }
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;

        location /api/ {
            proxy_pass http://backend:2000; # conserver le préfixe /api
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://frontend:5173/; #redirection vers le frontend
            proxy_set_header Host $host; #garder le header localhost.fr
            proxy_set_header X-Real-IP $remote_addr; #recevoir l'ip de l'user

            #necessaire au websocket du hot reload de Vite
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    #entree sans TLS, pour Live Share et les demos
    server {
        listen 8080;
        server_name _;

        location /api/ {
            proxy_pass http://backend:2000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://frontend:5173/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}